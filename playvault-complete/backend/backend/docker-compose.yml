services:
  postgres:
    image: postgres:16-alpine
    container_name: playvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: playvault
      POSTGRES_USER: playvault
      POSTGRES_PASSWORD: playvault
    ports:
      - "5432:5432"
    volumes:
      - playvault_pgdata:/var/lib/postgresql/data
volumes:
  playvault_pgdata:
